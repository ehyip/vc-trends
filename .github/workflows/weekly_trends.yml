name: Weekly VC Trend Intelligence

on:
  schedule:
    # Every Monday at 10:00 UTC (6:00 AM ET)
    - cron: "0 10 * * 1"
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit dedup state + dashboard back

jobs:
  trend-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EDGAR_CONTACT_EMAIL: ${{ secrets.EDGAR_CONTACT_EMAIL }}
        run: python run_trends.py

      - name: Commit dedup state + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/seen_urls.json output/previous_themes.json output/latest_run.json docs/ || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: weekly run $(date -u +%Y-%m-%d) — update state + dashboard"
            git push
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-results-${{ github.run_number }}
          path: output/
          retention-days: 30

  deploy-pages:
    needs: trend-scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (post-commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
